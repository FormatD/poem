<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诗词闯关 · 中国古诗词大赛</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="paper">

  <!-- 首页：难度选择 -->
  <section id="screen-home" class="screen active">
    <header class="masthead">
      <div class="seal">闯关</div>
      <div class="masthead-text">
        <h1>中国诗词大赛</h1>
        <p class="sub">题库取自三十四万首古诗词全集，按用字生僻度、篇幅、体裁与作者流传度自动分级</p>
      </div>
    </header>

    <div class="corpus-bar" id="corpus-bar">
      <span class="dot"></span><span id="corpus-info">正在连接诗词库…</span>
    </div>

    <div class="levels" id="levels"></div>

    <div class="browse-nav">
      <button class="ghost" id="btn-open-tiers">分档书目</button>
      <button class="ghost" id="btn-open-library">全库检索</button>
    </div>

    <footer class="home-foot">
      <div class="daily" id="daily">
        <div class="daily-head">
          <strong>随机一诗</strong>
          <div class="lang-switch" id="lang-switch">
            <button data-lang="zh-Hans" class="on">简</button>
            <button data-lang="zh-Hant">繁</button>
          </div>
        </div>
        <div class="daily-body" id="daily-body">—</div>
      </div>
      <button class="ghost" id="btn-reset">重置全部进度</button>
    </footer>
  </section>

  <!-- 关卡地图 -->
  <section id="screen-map" class="screen">
    <div class="nav">
      <button class="back" data-go="home">← 选难度</button>
      <h2 id="map-title">关卡</h2>
      <div class="map-summary" id="map-summary"></div>
    </div>
    <div class="stages" id="stages"></div>
  </section>

  <!-- 答题 -->
  <section id="screen-quiz" class="screen">
    <div class="hud">
      <button class="back small" id="btn-quit">退出</button>
      <div class="lives" id="lives"></div>
      <div class="hud-mid">
        <div class="qmeta"><span id="q-index">第 1 题 / 6</span> · <span id="q-kind">接下句</span></div>
        <div class="timer"><i id="timer-fill"></i></div>
      </div>
      <div class="score-box"><span id="hud-score">0</span><small>分</small></div>
    </div>

    <div class="combo" id="combo"></div>

    <article class="card" id="question-card">
      <div class="prompt" id="prompt"></div>
      <div class="stem" id="stem"></div>
      <div class="options" id="options"></div>
    </article>

    <article class="card reveal hidden" id="reveal-card">
      <div class="reveal-head"><span id="verdict"></span><span class="source" id="reveal-source"></span></div>
      <div class="poem-lines" id="reveal-poem"></div>
      <div class="explain" id="reveal-explain"></div>
      <div class="notes-head">逐项解析<span class="notes-tip">四个选项各指什么，包括你没选的那几个</span></div>
      <div class="opt-notes" id="reveal-opts"></div>
      <button class="primary" id="btn-next">下一题 →</button>
    </article>
  </section>

  <!-- 结算 -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <div class="big-seal" id="result-seal">及第</div>
      <div class="stars" id="result-stars"></div>
      <h2 id="result-title"></h2>
      <p class="result-sub" id="result-sub"></p>
      <div class="result-stats" id="result-stats"></div>
      <div class="result-actions">
        <button class="ghost" id="btn-retry">再来一次</button>
        <button class="primary" id="btn-continue">下一关 →</button>
        <button class="ghost" data-go="map">选关</button>
      </div>
    </div>
  </section>

  <!-- 分档书目：每一档题库里到底收了哪些诗 -->
  <section id="screen-tiers" class="screen">
    <div class="nav">
      <button class="back" data-go="home">← 选难度</button>
      <h2>分档书目</h2>
      <div class="nav-sum" id="tiers-sum"></div>
    </div>
    <div class="tabs" id="tiers-tabs"></div>
    <div class="filter-bar">
      <input id="tiers-q" type="search" placeholder="在本档题库内检索：标题 / 作者 / 诗句">
      <select id="tiers-dyn"><option value="">全部朝代</option></select>
      <select id="tiers-type"><option value="">全部体裁</option></select>
      <label class="chip"><input type="checkbox" id="tiers-canon"> 只看必背</label>
      <button class="chip" id="tiers-clear" hidden>清除筛选</button>
    </div>
    <div class="list-count" id="tiers-count">…</div>
    <div class="poem-list" id="tiers-list"></div>
    <button class="ghost more" id="tiers-more" hidden>加载更多</button>
  </section>

  <!-- 全库检索：按朝代分组浏览 + 全文搜索（走诗词 API） -->
  <section id="screen-library" class="screen">
    <div class="nav">
      <button class="back" data-go="home">← 选难度</button>
      <h2>全库检索</h2>
      <div class="nav-sum" id="lib-sum"></div>
    </div>
    <div class="filter-bar">
      <input id="lib-q" type="search" placeholder="搜索三十四万首：标题 / 正文 / 作者">
      <select id="lib-field">
        <option value="all">综合</option>
        <option value="title">仅标题</option>
        <option value="content">仅正文</option>
        <option value="author">仅作者</option>
      </select>
      <div class="lang-switch" id="lib-lang">
        <button data-lang="zh-Hans" class="on">简</button>
        <button data-lang="zh-Hant">繁</button>
      </div>
    </div>
    <div class="list-count" id="lib-count">…</div>
    <div id="lib-body"></div>
    <button class="ghost more" id="lib-more" hidden>加载更多</button>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
